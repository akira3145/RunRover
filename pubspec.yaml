name: roverapplication
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  google_fonts: 4.0.4
  flutter_otp_text_field: ^1.5.1+1
  otp_text_field: ^1.1.3
  google_maps_flutter: ^2.13.1
  geolocator: ^10.1.0
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.1
  google_maps_webservice: ^0.0.20-nullsafety.5
  flutter_native_splash: ^2.3.2
  http: ^0.13.6
  flutter_polyline_points: ^1.0.0
  flutter_google_places: ^0.3.0
  flutter_google_places_hoc081098: ^1.0.0-nullsafety.1
  google_api_headers: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "f7f6f1"
  color_dark: "272727"
  image: assets/images/r.png
  image_dark: assets/images/r.png

android_12:
  image: assets/images/r.png
  icon_background_color: "f7f6f1"
  image_dark: assets/images/r.png
  icon_background_color_dark: "272727"

# The `flutter` section must be a top-level mapping (same indentation as
# flutter_native_splash and android_12). The previous indentation placed
# `flutter:` under `android_12`, so assets were not recognized.
flutter:
  uses-material-design: true
  assets:
    # include the specific image used for splash and UI
    - assets/images/r.png
    - assets/images/gIcon.png
    - assets/images/